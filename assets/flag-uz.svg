<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="20" height="15" style="border-radius: 2px; box-shadow: 0 0 1px rgba(0,0,0,0.3); display: block;">
  <!-- Blue Stripe -->
  <rect width="500" height="80" fill="#0099B5"/>
  <!-- Red Border 1 -->
  <rect y="80" width="500" height="5" fill="#CE1126"/>
  <!-- White Stripe -->
  <rect y="85" width="500" height="80" fill="#FFFFFF"/>
  <!-- Red Border 2 -->
  <rect y="165" width="500" height="5" fill="#CE1126"/>
  <!-- Green Stripe -->
  <rect y="170" width="500" height="80" fill="#1EB53A"/>
  
  <!-- Crescent -->
  <circle cx="70" cy="40" r="30" fill="#FFFFFF"/>
  <circle cx="78" cy="40" r="26" fill="#0099B5"/>
  
  <!-- 12 Stars (simplified crisp stars) -->
  <g fill="#FFFFFF">
    <!-- Row 1: 3 stars -->
    <circle cx="120" cy="20" r="4"/>
    <circle cx="138" cy="20" r="4"/>
    <circle cx="156" cy="20" r="4"/>
    <!-- Row 2: 4 stars -->
    <circle cx="102" cy="38" r="4"/>
    <circle cx="120" cy="38" r="4"/>
    <circle cx="138" cy="38" r="4"/>
    <circle cx="156" cy="38" r="4"/>
    <!-- Row 3: 5 stars -->
    <circle cx="84" cy="56" r="4"/>
    <circle cx="102" cy="56" r="4"/>
    <circle cx="120" cy="56" r="4"/>
    <circle cx="138" cy="56" r="4"/>
    <circle cx="156" cy="56" r="4"/>
  </g>
</svg>
