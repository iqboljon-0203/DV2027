<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Torch / Red Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Blue Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3" />
    </linearGradient>

    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <path d="M 50 6 
           C 74 6, 88 15, 88 34 
           C 88 64, 68 84, 50 94 
           C 32 84, 12 64, 12 34 
           C 12 15, 26 6, 50 6 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#borderGrad)" 
        stroke-width="2.5" 
        filter="url(#shieldShadow)" />

  <!-- Inner Subtle Shield Contour -->
  <path d="M 50 12 
           C 70 12, 82 19, 82 35 
           C 82 61, 64 78, 50 86 
           C 36 78, 18 61, 18 35 
           C 18 19, 30 12, 50 12 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.12" 
        stroke-width="1.2" />

  <!-- US Flag Stripes Pattern inside bottom curve -->
  <g opacity="0.15">
    <path d="M 32 60 L 68 60 L 65 67 L 35 67 Z" fill="#DC2626" />
    <path d="M 37 72 L 63 72 L 60 78 L 40 78 Z" fill="#FFFFFF" />
    <path d="M 43 82 L 57 82 L 50 88 Z" fill="#DC2626" />
  </g>

  <!-- Stars Arch (3 Golden Stars) -->
  <g fill="url(#goldGrad)">
    <!-- Center Star -->
    <polygon points="50,17 52.2,21.8 57.5,22.4 53.6,26 54.7,31.2 50,28.5 45.3,31.2 46.4,26 42.5,22.4 47.8,21.8" />
    <!-- Left Star -->
    <polygon points="34,22 35.8,25.8 40,26.3 36.9,29.2 37.8,33.4 34,31.2 30.2,33.4 31.1,29.2 28,26.3 32.2,25.8" transform="scale(0.85) translate(8, 4)" />
    <!-- Right Star -->
    <polygon points="66,22 67.8,25.8 72,26.3 68.9,29.2 69.8,33.4 66,31.2 62.2,33.4 63.1,29.2 60,26.3 64.2,25.8" transform="scale(0.85) translate(14, 4)" />
  </g>

  <!-- Liberty Torch Flame -->
  <path d="M 50 31 
           C 53 35, 57 39, 56 44 
           C 55 49, 52 50, 50 54 
           C 48 50, 45 49, 44 44 
           C 43 39, 47 35, 50 31 Z" 
        fill="url(#flameGrad)" />

  <path d="M 50 37 
           C 51.5 40, 53.5 42, 53 45 
           C 52.5 48, 51 49, 50 51 
           C 49 49, 47.5 48, 47 45 
           C 46.5 42, 48.5 40, 50 37 Z" 
        fill="#FEF08A" />

  <!-- Torch Handle Base -->
  <path d="M 45 54 L 55 54 L 53 58 L 47 58 Z" fill="url(#goldGrad)" />
  <path d="M 48 58 L 52 58 L 51 66 L 49 66 Z" fill="url(#goldGrad)" />

  <!-- "DV" Monogram Text across the Emblem -->
  <text x="50" y="62" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="19" 
        font-weight="900" 
        letter-spacing="0.06em"
        fill="#FFFFFF">
    DV
  </text>

  <!-- 2027 Ribbon / Pill Badge -->
  <g transform="translate(0, 5)">
    <rect x="30" y="67" width="40" height="14" rx="7" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.2" />
    <text x="50" y="78" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
          font-size="9" 
          font-weight="800" 
          letter-spacing="0.1em"
          fill="#FFFFFF">
      2027
    </text>
  </g>
</svg>
